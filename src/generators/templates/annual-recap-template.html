<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duke Football Invitational - 2024 Wrapped</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Story Container */
        .story-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .story-container::-webkit-scrollbar {
            display: none;
        }

        .story-slide {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2.5rem 3rem;
        }

        /* Intro Slide */
        .intro-slide {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .intro-slide h1 {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .intro-slide p {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        /* Horse Race Slide */
        .horse-race-slide {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .slide-title {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .horse-race-container {
            width: 95%;
            max-width: 1400px;
            height: 72vh;
            min-height: 500px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            overflow-y: auto;
        }

        .horse-race-container::-webkit-scrollbar {
            width: 8px;
        }

        .horse-race-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .horse-race-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        #raceChart {
            width: 100%;
            min-height: 500px;
        }

        /* D3 Bar Chart Styling */
        .bar-rect {
            fill: rgba(255, 255, 255, 0.25);
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2px;
        }

        .bar-label {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            font-weight: 700;
            fill: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-value {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            font-weight: 900;
            fill: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-record {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 11px;
            font-weight: 600;
            fill: rgba(255, 255, 255, 0.85);
        }

        .bar-rank {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 18px;
            font-weight: 900;
            fill: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Mobile Optimizations for Bar Chart */
        @media (max-width: 768px) {
            .bar-label {
                font-size: 16px;
                font-weight: 900;
            }

            .bar-value {
                font-size: 12px;
                font-weight: 600;
                fill: rgba(255, 255, 255, 0.75);
            }

            .bar-record {
                font-size: 9px;
                fill: rgba(255, 255, 255, 0.65);
            }

            .bar-rank {
                font-size: 20px;
            }

            .horse-race-container {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .bar-label {
                font-size: 14px;
                font-weight: 900;
            }

            .bar-value {
                font-size: 11px;
                font-weight: 500;
                fill: rgba(255, 255, 255, 0.7);
            }

            .bar-record {
                display: none; /* Hide W-L record on very small screens */
            }

            .bar-rank {
                font-size: 18px;
            }
        }

        /* Controls */
        .race-controls {
            margin-top: 2rem;
            display: none; /* Hidden - auto-play enabled */
            gap: 1rem;
        }

        .race-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .race-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .week-indicator {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            text-align: center;
        }

        /* Restart Button */
        .restart-btn {
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .restart-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        /* Navigation dots */
        .nav-dots {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: white;
            transform: scale(1.5);
        }

        /* Awards Slide */
        .awards-slide {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .awards-grid {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            max-height: 72vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .awards-grid::-webkit-scrollbar {
            width: 8px;
        }

        .awards-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .awards-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .award-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .award-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .award-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .award-icon {
            font-size: 2.5rem;
        }

        .award-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .award-winner {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .award-winner-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .award-winner-info {
            flex: 1;
        }

        .award-winner-team {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .award-winner-count {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .award-details {
            margin-top: 1rem;
        }

        .award-detail-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .award-detail-week {
            font-weight: 700;
            color: #ffd700;
        }

        .award-detail-stat {
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        /* Weekly Recap Slide */
        .weekly-recap-slide {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .weekly-recap-container {
            width: 90%;
            max-width: 1200px;
            max-height: 72vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .weekly-recap-container::-webkit-scrollbar {
            width: 8px;
        }

        .weekly-recap-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .weekly-recap-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .week-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .week-card-header {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .week-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .week-stat-box {
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .week-stat-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .week-stat-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .week-stat-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .week-stat-name {
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .week-stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .week-winners {
            text-align: center;
        }

        .week-winners-label {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .week-winners-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .week-winner-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .week-winner-logo:hover {
            transform: scale(1.15);
        }

        /* Season Recap Slide */
        .season-recap-slide {
            background: linear-gradient(135deg, #2d3436 0%, #4a5568 100%);
            color: #ffffff;
        }

        .season-recap-grid {
            width: 95%;
            max-width: 1600px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-height: 75vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .season-recap-grid::-webkit-scrollbar {
            width: 8px;
        }

        .season-recap-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .season-recap-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .season-recap-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            color: #ffffff;
        }

        .season-recap-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .recap-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .recap-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .recap-team-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .recap-team {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.15);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            min-width: 280px;
        }

        .recap-team-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .recap-team-name {
            font-size: 1.3rem;
            font-weight: 700;
            flex: 1;
            text-align: left;
        }

        .recap-count {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .recap-stat {
            font-size: 1.1rem;
            opacity: 0.95;
            margin-top: 0.5rem;
        }

        .recap-record {
            font-size: 1rem;
            opacity: 0.85;
            margin-top: 0.25rem;
        }

        /* Team Stats Slide - Warm Championship Theme */
        .team-stats-slide {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        .team-stats-slide::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 70%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(212, 175, 55, 0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .team-stats-carousel {
            width: 95%;
            max-width: 1600px;
            height: 72vh;
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            padding: 1.5rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 1;
        }

        .team-stats-carousel::-webkit-scrollbar {
            height: 8px;
        }

        .team-stats-carousel::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
        }

        .team-stats-carousel::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #d4af37, #f4d03f);
            border-radius: 10px;
        }

        .team-stat-card {
            min-width: 400px;
            max-width: 400px;
            max-height: 68vh;
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(15, 52, 96, 0.9));
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(212, 175, 55, 0.2);
            scroll-snap-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            color: #e8e8e8;
            position: relative;
        }

        .team-stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #f4d03f, #d4af37);
            border-radius: 16px 16px 0 0;
        }

        .team-stat-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            flex: 1;
        }

        .team-stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.2),
                        0 4px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(212, 175, 55, 0.5);
        }

        .team-stat-header {
            text-align: center;
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            flex-shrink: 0;
        }

        .team-stat-logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            margin-bottom: 0.5rem;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .team-stat-name {
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #f4d03f;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-stat-item {
            background: rgba(212, 175, 55, 0.08);
            padding: 0.5rem 0.6rem;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: all 0.2s ease;
        }

        .team-stat-item:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.25);
        }

        .team-stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #d4af37;
            margin-bottom: 0.2rem;
        }

        .team-stat-value {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
        }

        .team-stat-detail {
            font-size: 0.75rem;
            color: #a0a0a0;
            margin-top: 0.15rem;
        }

        .team-stat-pythagorean {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.08));
            padding: 0.6rem;
            border-radius: 8px;
            text-align: center;
            grid-column: span 2;
            flex-shrink: 0;
            margin-top: 0.5rem;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .pyth-expected {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            color: #c0c0c0;
        }

        .pyth-diff {
            font-size: 1.05rem;
            font-weight: 900;
        }

        .pyth-diff.positive {
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        .pyth-diff.negative {
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.3);
        }

        /* Additional Mobile Optimizations */
        @media (max-width: 768px) {
            .slide-title {
                font-size: 2.5rem;
            }

            .intro-slide h1 {
                font-size: 4rem;
            }

            .intro-slide p {
                font-size: 1.3rem;
            }

            .awards-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .award-card {
                padding: 2rem;
            }

            .week-card {
                padding: 2rem;
            }

            .week-stats {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .season-recap-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .season-recap-card {
                padding: 1.5rem;
            }

            .recap-title {
                font-size: 1.4rem;
            }

            .team-stat-card {
                min-width: 350px;
                max-width: 350px;
                padding: 2rem;
            }
        }

        @media (max-width: 480px) {
            .story-slide {
                padding: 1.5rem 2rem;
            }

            .slide-title {
                font-size: 2rem;
                margin-bottom: 1rem;
            }

            .intro-slide h1 {
                font-size: 3rem;
            }

            .intro-slide p {
                font-size: 1.2rem;
            }

            .horse-race-container {
                padding: 0.75rem;
            }

            .awards-grid {
                padding: 1rem;
                max-height: 75vh;
            }

            .award-card {
                padding: 1.5rem;
            }

            .award-header {
                margin-bottom: 1rem;
            }

            .award-icon {
                font-size: 2rem;
            }

            .award-title {
                font-size: 1rem;
            }

            .weekly-recap-container {
                padding: 1rem;
                max-height: 75vh;
            }

            .week-card {
                padding: 1.5rem;
                margin-bottom: 2rem;
            }

            .week-card-header {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .week-stat-logo {
                width: 50px;
                height: 50px;
            }

            .week-stat-name {

        let currentWeek = -1;  // Start at preseason
        let isPlaying = false;
        let playInterval = null;

        // Initialize race track
        // D3.js Bar Race Chart Variables
        let svg, xScale, yScale, barHeight;
        const margin = { top: 10, right: 150, bottom: 10, left: 80 };

        function initRaceTrack() {
            const container = document.querySelector('.horse-race-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Clear existing SVG
            d3.select('#raceChart').selectAll('*').remove();

            // Setup SVG
            svg = d3.select('#raceChart')
                .attr('width', width)
                .attr('height', height);

            // Calculate dimensions
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            barHeight = Math.min(40, chartHeight / teamData.teams.length - 2);

            // Create scales
            const maxPoints = d3.max(teamData.weeklyRecords.flat(), d => d.points);
            xScale = d3.scaleLinear()
                .domain([0, maxPoints * 1.1])
                .range([0, chartWidth]);

            yScale = d3.scaleBand()
                .domain(d3.range(teamData.teams.length))
                .range([margin.top, chartHeight])
                .padding(0.1);

            // Create chart group
            const chart = svg.append('g')
                .attr('transform', `translate(${margin.left}, 0)`);

            // Initialize with week 0 (preseason - all zeros, week 1 ordering)
            updateStandings(-1, true);
        }

        // Update standings for a given week with D3 transitions
        function updateStandings(week, instant = false) {
            // Week -1 is preseason (all zeros, week 1 ordering)
            const isPreseason = week === -1;
            const standings = isPreseason ? teamData.weeklyStandings[0] : teamData.weeklyStandings[week];
            const duration = instant ? 0 : 800;

            // Prepare data for ALL teams
            const data = standings.map((teamId, rank) => {
                const team = teamData.teams.find(t => t.id === teamId);
                const record = isPreseason
                    ? { wins: 0, losses: 0, points: 0 }  // Preseason: all zeros
                    : teamData.weeklyRecords[week][teamId - 1];
                return {
                    teamId,
                    rank: rank + 1,
                    name: team.name,
                    logo: team.logo,
                    wins: record.wins,
                    losses: record.losses,
                    points: record.points,
                    position: rank,  // Use rank for consistent positioning
                    isPreseason
                };
            });

            // Bind data to bars
            const bars = svg.selectAll('.bar-group')
                .data(data, d => d.teamId);

            // Remove any exiting bars
            bars.exit().remove();

            // Enter new bars
            const barsEnter = bars.enter()
                .append('g')
                .attr('class', 'bar-group');

            // Add rectangles for bars
            barsEnter.append('rect')
                .attr('class', 'bar-rect')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.position) + margin.top)
                .attr('width', 0)
                .attr('height', barHeight)
                .attr('rx', 8);

            // Add rank text (on left)
            barsEnter.append('text')
                .attr('class', 'bar-rank')
                .attr('x', margin.left - 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('text-anchor', 'end')
                .attr('dominant-baseline', 'middle')
                .text(d => d.rank);

            // Add team logos
            barsEnter.append('image')
                .attr('class', 'bar-logo')
                .attr('x', margin.left + 8)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 - 15)
                .attr('width', 30)
                .attr('height', 30)
                .attr('href', d => d.logo);

            // Add team name labels
            barsEnter.append('text')
                .attr('class', 'bar-label')
                .attr('x', margin.left + 45)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('dominant-baseline', 'middle')
                .text(d => d.name);

            // Add record text (W-L)
            barsEnter.append('text')
                .attr('class', 'bar-record')
                .attr('x', margin.left + 45)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 + 12)
                .attr('dominant-baseline', 'middle')
                .text(d => `${d.wins}-${d.losses}`);

            // Add value labels (points - on right, hidden in preseason)
            barsEnter.append('text')
                .attr('class', 'bar-value')
                .attr('x', margin.left + 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('text-anchor', 'start')
                .attr('dominant-baseline', 'middle')
                .attr('opacity', d => d.isPreseason ? 0 : 1)  // Hide in preseason
                .text(d => d.points.toFixed(1));

            // Update existing + new bars
            const allBars = barsEnter.merge(bars);

            // Update rectangles with animation
            allBars.select('.bar-rect')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top)
                .attr('width', d => xScale(d.points));

            // Update rank with animation
            allBars.select('.bar-rank')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .tween('text', function(d) {
                    const i = d3.interpolateNumber(+this.textContent || d.rank, d.rank);
                    return function(t) {
                        this.textContent = Math.round(i(t));
                    };
                });

            // Update logo position with animation
            allBars.select('.bar-logo')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 - 15);

            // Update label position with animation
            allBars.select('.bar-label')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2);

            // Update record position and text
            allBars.select('.bar-record')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 + 12)
                .tween('text', function(d) {
                    return function(t) {
                        this.textContent = `${d.wins}-${d.losses}`;
                    };
                });

            // Update value position and text with animation
            allBars.select('.bar-value')
                .transition()
                .duration(duration)
                .attr('x', d => margin.left + xScale(d.points) + 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('opacity', d => d.isPreseason ? 0 : 1)  // Show/hide based on preseason
                .tween('text', function(d) {
                    const currentValue = parseFloat(this.textContent) || 0;
                    const i = d3.interpolateNumber(currentValue, d.points);
                    return function(t) {
                        this.textContent = i(t).toFixed(1);
                    };
                });

            // Update week indicator
            if (isPreseason) {
                document.getElementById('weekIndicator').textContent = 'Preseason';
            } else {
                document.getElementById('weekIndicator').textContent = `Week ${week + 1}`;
            }
        }

        // Play through the season
        function playSeason() {
            if (isPlaying) return;

            isPlaying = true;
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Playing...';
            if (restartBtn) restartBtn.classList.remove('visible');

            playInterval = setInterval(() => {
                currentWeek++;

                if (currentWeek >= teamData.weeklyStandings.length) {
                    stopPlaying();
                    return;
                }

                updateStandings(currentWeek);
            }, 1200); // Change every 1.2 seconds (faster animation)
        }

        function stopPlaying() {
            isPlaying = false;
            clearInterval(playInterval);
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Play Season';

            // Show restart button when animation completes
            if (currentWeek >= teamData.weeklyStandings.length - 1) {
                if (restartBtn) restartBtn.classList.add('visible');
            }
        }

        function resetRace() {
            stopPlaying();
            currentWeek = -1;  // Reset to preseason
            updateStandings(-1);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');
        }

        function restartRace() {
            // Reset to beginning (preseason)
            currentWeek = -1;
            updateStandings(-1);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');

            // Start playing after a brief delay
            setTimeout(() => {
                playSeason();
            }, 300);
        }

        // Event listeners
        document.getElementById('playBtn').addEventListener('click', playSeason);
        document.getElementById('resetBtn').addEventListener('click', resetRace);
        document.getElementById('restartBtn').addEventListener('click', restartRace);

                card.className = 'week-card';

                const winnersHtml = weekData.winners.map(winner => `
                    <img class="week-winner-logo" src="${winner.logo}" alt="${winner.name}" title="${winner.name}">
                `).join('');

                card.innerHTML = `
                    <div class="week-card-header">Week ${weekData.week}</div>
                    <div class="week-stats">
                        <div class="week-stat-box" style="background: ${weekData.highestScorer.bgColor}; color: ${weekData.highestScorer.fontColor};">
                            <div class="week-stat-label">🔥 Highest Scorer</div>
                            <div class="week-stat-team">
                                <img class="week-stat-logo" src="${weekData.highestScorer.logo}" alt="${weekData.highestScorer.teamName}">
                                <div class="week-stat-name">${weekData.highestScorer.teamName}</div>
                            </div>
                            <div class="week-stat-value">${weekData.highestScorer.score.toFixed(1)} pts</div>
                        </div>
                        <div class="week-stat-box" style="background: ${weekData.lowestScorer.bgColor}; color: ${weekData.lowestScorer.fontColor};">
                            <div class="week-stat-label">❄️ Lowest Scorer</div>
                            <div class="week-stat-team">
                                <img class="week-stat-logo" src="${weekData.lowestScorer.logo}" alt="${weekData.lowestScorer.teamName}">
                                <div class="week-stat-name">${weekData.lowestScorer.teamName}</div>
                            </div>
                            <div class="week-stat-value">${weekData.lowestScorer.score.toFixed(1)} pts</div>
                        </div>
                    </div>
                    <div class="week-winners">
                        <div class="week-winners-label">🏆 Weekly Winners (${weekData.winners.length})</div>
                        <div class="week-winners-grid">
                            ${winnersHtml}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Auto-play animation when horse-race slide comes into view
        function setupAutoPlay() {
            const horseRaceSlide = document.querySelector('.horse-race-slide');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isPlaying && currentWeek === -1) {
                        // Start playing when slide becomes visible (from preseason)
                        setTimeout(() => {
                            playSeason();
                        }, 500); // Small delay for better UX
                    }
                });
            }, {
                threshold: 0.5 // Trigger when 50% of slide is visible
            });

            observer.observe(horseRaceSlide);
        }

        // Initialize
        initRaceTrack();
        initAwardsGrid();
        initSeasonRecap();
        initTeamStats();
        initWeeklyRecap();
        setupAutoPlay();
    </script>
</body>
</html>
