<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duke Football Invitational - 2024 Wrapped</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Story Container */
        .story-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .story-container::-webkit-scrollbar {
            display: none;
        }

        .story-slide {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 3rem;
        }

        /* Intro Slide */
        .intro-slide {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .intro-slide h1 {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .intro-slide p {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        /* Horse Race Slide */
        .horse-race-slide {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .slide-title {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .horse-race-container {
            width: 90%;
            max-width: 1200px;
            height: 600px;
            position: relative;
        }

        .race-track {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .team-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .team-rank {
            font-size: 2rem;
            font-weight: 900;
            width: 60px;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .team-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .team-record {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 0.25rem;
        }

        /* Controls */
        .race-controls {
            margin-top: 2rem;
            display: none; /* Hidden - auto-play enabled */
            gap: 1rem;
        }

        .race-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .race-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .week-indicator {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            text-align: center;
        }

        /* Restart Button */
        .restart-btn {
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .restart-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        /* Navigation dots */
        .nav-dots {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: white;
            transform: scale(1.5);
        }

        /* Awards Slide */
        .awards-slide {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .awards-grid {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-height: 70vh;
            overflow-y: auto;
            padding: 1rem;
        }

        .awards-grid::-webkit-scrollbar {
            width: 8px;
        }

        .awards-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .awards-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .award-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .award-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .award-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .award-icon {
            font-size: 2.5rem;
        }

        .award-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .award-winner {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .award-winner-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .award-winner-info {
            flex: 1;
        }

        .award-winner-team {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .award-winner-count {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .award-details {
            margin-top: 1rem;
        }

        .award-detail-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .award-detail-week {
            font-weight: 700;
            color: #ffd700;
        }

        .award-detail-stat {
            opacity: 0.9;
            margin-top: 0.25rem;
        }

            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

            margin-bottom: 2rem;

            font-weight: 900;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);

            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }

        .week-stat-label {

            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .week-stat-name {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .week-stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .week-winners {
            text-align: center;
        }

        .week-winners-label {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .week-winners-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .week-winner-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .week-winner-logo:hover {
            transform: scale(1.15);
        }
    </style>

        // Initialize race track
        function initRaceTrack() {
            const raceTrack = document.getElementById('raceTrack');
            raceTrack.innerHTML = '';

            // Create team rows in initial order
            teamData.weeklyStandings[0].forEach((teamId, index) => {
                const team = teamData.teams.find(t => t.id === teamId);
                const record = teamData.weeklyRecords[0][teamId - 1];

                const row = document.createElement('div');
                row.className = 'team-row';
                row.dataset.teamId = teamId;
                row.style.order = index;

                row.innerHTML = `
                    <div class="team-rank">${index + 1}</div>
                    <img class="team-logo" src="${team.logo}" alt="${team.name}">
                    <div class="team-info">
                        <div class="team-name">${team.name}</div>
                        <div class="team-record">${record.wins}-${record.losses} • ${record.points.toFixed(1)} pts</div>
                    </div>
                `;

                raceTrack.appendChild(row);
            });
        }

        // Update standings for a given week
        function updateStandings(week) {
            const raceTrack = document.getElementById('raceTrack');
            const standings = teamData.weeklyStandings[week];

            standings.forEach((teamId, newPosition) => {
                const row = raceTrack.querySelector(`[data-team-id="${teamId}"]`);
                const record = teamData.weeklyRecords[week][teamId - 1];

                // Update position
                row.style.order = newPosition;

                // Update rank number
                row.querySelector('.team-rank').textContent = newPosition + 1;

                // Update record
                row.querySelector('.team-record').textContent =
                    `${record.wins}-${record.losses} • ${record.points.toFixed(1)} pts`;
            });

            // Update week indicator
            document.getElementById('weekIndicator').textContent = `Week ${week + 1}`;
        }

        // Play through the season
        function playSeason() {
            if (isPlaying) return;

            isPlaying = true;
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Playing...';
            if (restartBtn) restartBtn.classList.remove('visible');

            playInterval = setInterval(() => {
                currentWeek++;

                if (currentWeek >= teamData.weeklyStandings.length) {
                    stopPlaying();
                    return;
                }

                updateStandings(currentWeek);
            }, 1200); // Change every 1.2 seconds (faster animation)
        }

        function stopPlaying() {
            isPlaying = false;
            clearInterval(playInterval);
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Play Season';

            // Show restart button when animation completes
            if (currentWeek >= teamData.weeklyStandings.length - 1) {
                if (restartBtn) restartBtn.classList.add('visible');
            }
        }

        function resetRace() {
            stopPlaying();
            currentWeek = 0;
            updateStandings(0);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');
        }

        function restartRace() {
            // Reset to beginning
            currentWeek = 0;
            updateStandings(0);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');

            // Start playing after a brief delay
            setTimeout(() => {
                playSeason();
            }, 300);
        }

        document.getElementById('playBtn').addEventListener('click', playSeason);
        document.getElementById('resetBtn').addEventListener('click', resetRace);

        storyContainer.addEventListener('scroll', () => {
            const slides = document.querySelectorAll('.story-slide');
            const scrollPosition = storyContainer.scrollTop;

            slides.forEach((slide, index) => {
                const slideTop = slide.offsetTop;
                const slideHeight = slide.offsetHeight;

                if (scrollPosition >= slideTop - slideHeight / 2 &&
                    scrollPosition < slideTop + slideHeight / 2) {
                    navDots.forEach(d => d.classList.remove('active'));

                }
            });
        });

        // Auto-play animation when horse-race slide comes into view
        function setupAutoPlay() {
            const horseRaceSlide = document.querySelector('.horse-race-slide');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isPlaying && currentWeek === 0) {
                        // Start playing when slide becomes visible
                        setTimeout(() => {
                            playSeason();
                        }, 500); // Small delay for better UX
                    }
                });
            }, {
                threshold: 0.5 // Trigger when 50% of slide is visible
            });

            observer.observe(horseRaceSlide);
        }

        initWeeklyRecap();
        setupAutoPlay();
