<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duke Football Invitational - 2024 Wrapped</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        /* Story Container */
        .story-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .story-container::-webkit-scrollbar {
            display: none;
        }

        .story-slide {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 2.5rem 3rem;
        }

        /* Intro Slide */
        .intro-slide {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .intro-slide h1 {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .intro-slide p {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        /* Horse Race Slide */
        .horse-race-slide {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .slide-title {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        .horse-race-container {
            width: 95%;
            max-width: 1400px;
            height: 72vh;
            min-height: 500px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            overflow-y: auto;
        }

        .horse-race-container::-webkit-scrollbar {
            width: 8px;
        }

        .horse-race-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .horse-race-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        #raceChart {
            width: 100%;
            min-height: 500px;
        }

        /* D3 Bar Chart Styling */
        .bar-rect {
            fill: rgba(255, 255, 255, 0.25);
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2px;
        }

        .bar-label {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            font-weight: 700;
            fill: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-value {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            font-weight: 900;
            fill: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-record {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 11px;
            font-weight: 600;
            fill: rgba(255, 255, 255, 0.85);
        }

        .bar-rank {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 18px;
            font-weight: 900;
            fill: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Controls */
        .race-controls {
            margin-top: 2rem;
            display: none; /* Hidden - auto-play enabled */
            gap: 1rem;
        }

        .race-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .race-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .week-indicator {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            text-align: center;
        }

        /* Restart Button */
        .restart-btn {
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .restart-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        /* Navigation dots */
        .nav-dots {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: white;
            transform: scale(1.5);
        }

        /* Awards Slide */
        .awards-slide {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .awards-grid {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            max-height: 72vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .awards-grid::-webkit-scrollbar {
            width: 8px;
        }

        .awards-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .awards-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .award-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .award-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .award-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .award-icon {
            font-size: 2.5rem;
        }

        .award-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .award-winner {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .award-winner-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .award-winner-info {
            flex: 1;
        }

        .award-winner-team {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .award-winner-count {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .award-details {
            margin-top: 1rem;
        }

        .award-detail-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .award-detail-week {
            font-weight: 700;
            color: #ffd700;
        }

        .award-detail-stat {
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        }

            max-width: 1200px;

        }

            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border: 2px solid rgba(255, 255, 255, 0.2);

            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .week-stat-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .week-stat-label {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .week-stat-team {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .week-stat-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .week-stat-name {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .week-stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .week-winners {
            text-align: center;
        }

        .week-winners-label {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .week-winners-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .week-winner-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .week-winner-logo:hover {
            transform: scale(1.15);
        }

        // Initialize race track
        // D3.js Bar Race Chart Variables
        let svg, xScale, yScale, barHeight;
        const margin = { top: 10, right: 150, bottom: 10, left: 80 };

        function initRaceTrack() {
            const container = document.querySelector('.horse-race-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Clear existing SVG
            d3.select('#raceChart').selectAll('*').remove();

            // Setup SVG
            svg = d3.select('#raceChart')
                .attr('width', width)
                .attr('height', height);

            // Calculate dimensions
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            barHeight = Math.min(40, chartHeight / teamData.teams.length - 2);

            // Create scales
            const maxPoints = d3.max(teamData.weeklyRecords.flat(), d => d.points);
            xScale = d3.scaleLinear()
                .domain([0, maxPoints * 1.1])
                .range([0, chartWidth]);

            yScale = d3.scaleBand()
                .domain(d3.range(teamData.teams.length))
                .range([margin.top, chartHeight])
                .padding(0.1);

            // Create chart group
            const chart = svg.append('g')
                .attr('transform', `translate(${margin.left}, 0)`);

            // Initialize with week 0 (preseason - all zeros, week 1 ordering)
            updateStandings(-1, true);
        }

        // Update standings for a given week with D3 transitions
        function updateStandings(week, instant = false) {
            // Week -1 is preseason (all zeros, week 1 ordering)
            const isPreseason = week === -1;
            const standings = isPreseason ? teamData.weeklyStandings[0] : teamData.weeklyStandings[week];
            const duration = instant ? 0 : 800;

            // Prepare data for ALL teams
            const data = standings.map((teamId, rank) => {
                const team = teamData.teams.find(t => t.id === teamId);
                const record = isPreseason
                    ? { wins: 0, losses: 0, points: 0 }  // Preseason: all zeros
                    : teamData.weeklyRecords[week][teamId - 1];
                return {
                    teamId,
                    rank: rank + 1,
                    name: team.name,
                    logo: team.logo,
                    wins: record.wins,
                    losses: record.losses,
                    points: record.points,
                    position: rank,  // Use rank for consistent positioning
                    isPreseason
                };
            });

            // Bind data to bars
            const bars = svg.selectAll('.bar-group')
                .data(data, d => d.teamId);

            // Remove any exiting bars
            bars.exit().remove();

            // Enter new bars
            const barsEnter = bars.enter()
                .append('g')
                .attr('class', 'bar-group');

            // Add rectangles for bars
            barsEnter.append('rect')
                .attr('class', 'bar-rect')
                .attr('x', margin.left)
                .attr('y', d => yScale(d.position) + margin.top)
                .attr('width', 0)
                .attr('height', barHeight)
                .attr('rx', 8);

            // Add rank text (on left)
            barsEnter.append('text')
                .attr('class', 'bar-rank')
                .attr('x', margin.left - 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('text-anchor', 'end')
                .attr('dominant-baseline', 'middle')
                .text(d => d.rank);

            // Add team logos
            barsEnter.append('image')
                .attr('class', 'bar-logo')
                .attr('x', margin.left + 8)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 - 15)
                .attr('width', 30)
                .attr('height', 30)
                .attr('href', d => d.logo);

            // Add team name labels
            barsEnter.append('text')
                .attr('class', 'bar-label')
                .attr('x', margin.left + 45)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('dominant-baseline', 'middle')
                .text(d => d.name);

            // Add record text (W-L)
            barsEnter.append('text')
                .attr('class', 'bar-record')
                .attr('x', margin.left + 45)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 + 12)
                .attr('dominant-baseline', 'middle')
                .text(d => `${d.wins}-${d.losses}`);

            // Add value labels (points - on right, hidden in preseason)
            barsEnter.append('text')
                .attr('class', 'bar-value')
                .attr('x', margin.left + 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('text-anchor', 'start')
                .attr('dominant-baseline', 'middle')
                .attr('opacity', d => d.isPreseason ? 0 : 1)  // Hide in preseason
                .text(d => d.points.toFixed(1));

            // Update existing + new bars
            const allBars = barsEnter.merge(bars);

            // Update rectangles with animation
            allBars.select('.bar-rect')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top)
                .attr('width', d => xScale(d.points));

            // Update rank with animation
            allBars.select('.bar-rank')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .tween('text', function(d) {
                    const i = d3.interpolateNumber(+this.textContent || d.rank, d.rank);
                    return function(t) {
                        this.textContent = Math.round(i(t));
                    };
                });

            // Update logo position with animation
            allBars.select('.bar-logo')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 - 15);

            // Update label position with animation
            allBars.select('.bar-label')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2);

            // Update record position and text
            allBars.select('.bar-record')
                .transition()
                .duration(duration)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2 + 12)
                .tween('text', function(d) {
                    return function(t) {
                        this.textContent = `${d.wins}-${d.losses}`;
                    };
                });

            // Update value position and text with animation
            allBars.select('.bar-value')
                .transition()
                .duration(duration)
                .attr('x', d => margin.left + xScale(d.points) + 10)
                .attr('y', d => yScale(d.position) + margin.top + barHeight / 2)
                .attr('opacity', d => d.isPreseason ? 0 : 1)  // Show/hide based on preseason
                .tween('text', function(d) {
                    const currentValue = parseFloat(this.textContent) || 0;
                    const i = d3.interpolateNumber(currentValue, d.points);
                    return function(t) {
                        this.textContent = i(t).toFixed(1);
                    };
                });

            // Update week indicator
            if (isPreseason) {
                document.getElementById('weekIndicator').textContent = 'Preseason';
            } else {
                document.getElementById('weekIndicator').textContent = `Week ${week + 1}`;
            }
        }

        // Play through the season
        function playSeason() {
            if (isPlaying) return;

            isPlaying = true;
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Playing...';
            if (restartBtn) restartBtn.classList.remove('visible');

            playInterval = setInterval(() => {
                currentWeek++;

                if (currentWeek >= teamData.weeklyStandings.length) {
                    stopPlaying();
                    return;
                }

                updateStandings(currentWeek);
            }, 1200); // Change every 1.2 seconds (faster animation)
        }

        function stopPlaying() {
            isPlaying = false;
            clearInterval(playInterval);
            const playBtn = document.getElementById('playBtn');
            const restartBtn = document.getElementById('restartBtn');

            if (playBtn) playBtn.textContent = 'Play Season';

            // Show restart button when animation completes
            if (currentWeek >= teamData.weeklyStandings.length - 1) {
                if (restartBtn) restartBtn.classList.add('visible');
            }
        }

        function resetRace() {
            stopPlaying();
            currentWeek = -1;  // Reset to preseason
            updateStandings(-1);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');
        }

        function restartRace() {
            // Reset to beginning (preseason)
            currentWeek = -1;
            updateStandings(-1);

            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.classList.remove('visible');

            // Start playing after a brief delay
            setTimeout(() => {
                playSeason();
            }, 300);
        }

        // Auto-play animation when horse-race slide comes into view
        function setupAutoPlay() {
            const horseRaceSlide = document.querySelector('.horse-race-slide');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isPlaying && currentWeek === -1) {
                        // Start playing when slide becomes visible (from preseason)
                        setTimeout(() => {
                            playSeason();
                        }, 500); // Small delay for better UX
                    }
                });
            }, {
                threshold: 0.5 // Trigger when 50% of slide is visible
            });

            observer.observe(horseRaceSlide);
        }
