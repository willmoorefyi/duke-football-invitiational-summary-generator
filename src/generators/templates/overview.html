<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ league_name }} - Season Overview</title>
    <style>
        {% include 'styles.css' %}

        /* Additional styles for overview page */
        .overview-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .overview-header h1 {
            color: #2c3e50;
            margin: 20px 0 10px 0;
        }

        .overview-header .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        /* Week report link styling */
        .week-report-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s, transform 0.2s;
            display: inline-block;
        }

        .week-report-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overview-header">
            <a href="https://will.moore.fyi/duke-football-invitational/weekly-reports/index.html" target="_blank">
                <img src="{{ league_logo_url }}"
                     alt="{{ league_name }}"
                     title="{{ league_name }}"
                     class="league-title logo-header" />
            </a>
            <h1>Season {{ season }} Overview</h1>
            <div class="subtitle">
                Through Week {{ current_week }}<br>
                Generated: {{ formatted_date }}
            </div>
        </div>

        <div class="section-divider"></div>

        {% include 'overall_standings.html' %}

        <div class="section-divider"></div>

        {% include 'weekly_totals.html' %}

        {% include 'footer.html' %}
    </div>

    <script>
        {% include 'scripts.js' %}
    </script>
</body>
</html>
